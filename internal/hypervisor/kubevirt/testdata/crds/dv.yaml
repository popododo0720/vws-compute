# A stand-in for the CDI CRD. It declares the kind and keeps every field, so
# envtest exercises the API machinery but not CDI's own validation.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: datavolumes.cdi.kubevirt.io
spec:
  group: cdi.kubevirt.io
  scope: Namespaced
  names:
    kind: DataVolume
    listKind: DataVolumeList
    plural: datavolumes
    singular: datavolume
  versions:
    - name: v1beta1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          x-kubernetes-preserve-unknown-fields: true
