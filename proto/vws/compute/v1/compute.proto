// TODO(vws-proto): move this file to github.com/popododo0720/vws-proto once that module has content.
syntax = "proto3";

package vws.compute.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

option go_package = "github.com/popododo0720/vws-compute/internal/grpcapi/internal/computepb;computepb";

// ComputeService controls instances, images, and key pairs.
//
// Every mutating RPC:
//   - requires request_id, a caller-chosen idempotency key;
//   - records desired state and returns immediately with an Operation;
//   - never waits for the hypervisor.
//
// Sending the same request_id with the same request again returns the
// original Operation and changes nothing. Sending it with a different
// request fails with INVALID_ARGUMENT.
service ComputeService {
  rpc RunInstance(RunInstanceRequest) returns (RunInstanceResponse);
  rpc StartInstance(StartInstanceRequest) returns (StartInstanceResponse);
  rpc StopInstance(StopInstanceRequest) returns (StopInstanceResponse);
  rpc RebootInstance(RebootInstanceRequest) returns (RebootInstanceResponse);
  rpc TerminateInstance(TerminateInstanceRequest) returns (TerminateInstanceResponse);
  rpc DescribeInstances(DescribeInstancesRequest) returns (DescribeInstancesResponse);

  rpc RegisterImage(RegisterImageRequest) returns (RegisterImageResponse);
  rpc CreateImage(CreateImageRequest) returns (CreateImageResponse);
  rpc DescribeImages(DescribeImagesRequest) returns (DescribeImagesResponse);
  rpc DeregisterImage(DeregisterImageRequest) returns (DeregisterImageResponse);

  rpc CreateKeyPair(CreateKeyPairRequest) returns (CreateKeyPairResponse);
  rpc ImportKeyPair(ImportKeyPairRequest) returns (ImportKeyPairResponse);
  rpc DescribeKeyPairs(DescribeKeyPairsRequest) returns (DescribeKeyPairsResponse);
  rpc DeleteKeyPair(DeleteKeyPairRequest) returns (DeleteKeyPairResponse);

  rpc GetOperation(GetOperationRequest) returns (Operation);
  // WaitOperation blocks until the operation leaves PENDING or timeout
  // elapses (max 60s), then returns its current state. It is a read; it
  // never extends or cancels the operation.
  rpc WaitOperation(WaitOperationRequest) returns (Operation);
}

// ---------------------------------------------------------------- Instances

message RunInstanceRequest {
  // Idempotency key: 1-64 characters from [A-Za-z0-9_-]. Required. Use a
  // fresh UUID per logical request and reuse it on every retry.
  string request_id = 1;
  string image_id = 2;
  // A name from the server's instance-type catalog, for example "vws.small".
  string instance_type = 3;
  // Optional. The key pair's public key is copied into the instance at
  // launch; deleting the key pair later does not affect the instance.
  string key_name = 4;
}

message RunInstanceResponse {
  // Targets the new instance (operation.instance_id).
  Operation operation = 1;
}

message StartInstanceRequest {
  string request_id = 1;
  string instance_id = 2;
}

message StartInstanceResponse {
  Operation operation = 1;
}

message StopInstanceRequest {
  string request_id = 1;
  string instance_id = 2;
}

message StopInstanceResponse {
  Operation operation = 1;
}

message RebootInstanceRequest {
  string request_id = 1;
  string instance_id = 2;
}

message RebootInstanceResponse {
  // SUCCEEDED once the machine has rebooted at least once after this request
  // was accepted. A newer reboot accepted before that supersedes this one.
  Operation operation = 1;
}

message TerminateInstanceRequest {
  string request_id = 1;
  string instance_id = 2;
}

message TerminateInstanceResponse {
  Operation operation = 1;
}

message DescribeInstancesRequest {
  // Empty means all instances, including terminated ones still retained.
  repeated string instance_ids = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message DescribeInstancesResponse {
  repeated Instance instances = 1;
  string next_page_token = 2;
}

message Instance {
  string instance_id = 1;
  string image_id = 2;
  string instance_type = 3;
  string key_name = 4;
  string key_fingerprint = 5;
  // Derived on every read from desired and observed state; never stored.
  InstanceState state = 6;
  // Set when state is INSTANCE_STATE_ERROR.
  string state_reason = 7;
  google.protobuf.Timestamp launch_time = 8;
}

enum InstanceState {
  INSTANCE_STATE_UNSPECIFIED = 0;
  INSTANCE_STATE_PENDING = 1;
  INSTANCE_STATE_RUNNING = 2;
  INSTANCE_STATE_STOPPING = 3;
  INSTANCE_STATE_STOPPED = 4;
  INSTANCE_STATE_SHUTTING_DOWN = 5;
  INSTANCE_STATE_TERMINATED = 6;
  // The last change could not be applied. Issue a new start, stop, or
  // terminate to retry; the server does not retry a failed change on its own.
  INSTANCE_STATE_ERROR = 7;
}

// ------------------------------------------------------------------- Images

message RegisterImageRequest {
  string request_id = 1;
  string name = 2;
  // https URL of a disk image the hypervisor agent can fetch.
  string source_url = 3;
}

message RegisterImageResponse {
  Operation operation = 1;
}

message CreateImageRequest {
  string request_id = 1;
  string instance_id = 2;
  string name = 3;
}

message CreateImageResponse {
  Operation operation = 1;
}

message DeregisterImageRequest {
  string request_id = 1;
  string image_id = 2;
}

message DeregisterImageResponse {
  Operation operation = 1;
}

message DescribeImagesRequest {
  repeated string image_ids = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message DescribeImagesResponse {
  repeated Image images = 1;
  string next_page_token = 2;
}

message Image {
  string image_id = 1;
  string name = 2;
  ImageState state = 3;
  string state_reason = 4;
  oneof source {
    string source_url = 5;
    string source_instance_id = 6;
  }
  int64 size_bytes = 7;
  google.protobuf.Timestamp creation_time = 8;
}

enum ImageState {
  IMAGE_STATE_UNSPECIFIED = 0;
  IMAGE_STATE_PENDING = 1;
  IMAGE_STATE_AVAILABLE = 2;
  IMAGE_STATE_FAILED = 3;
  IMAGE_STATE_DEREGISTERED = 4;
}

// ---------------------------------------------------------------- Key pairs

message CreateKeyPairRequest {
  string request_id = 1;
  // 1-255 printable ASCII characters. Unique among live key pairs.
  string key_name = 2;
}

message CreateKeyPairResponse {
  // Always SUCCEEDED: key pairs have no hypervisor-side state.
  Operation operation = 1;
  KeyPair key_pair = 2;
  // OpenSSH-format ed25519 private key. Never stored by the server. It is
  // returned only on the call that inserted the key pair. A retry with the
  // same request_id returns an empty string and the same operation.
  string private_key_openssh = 3;
}

message ImportKeyPairRequest {
  string request_id = 1;
  string key_name = 2;
  // One authorized_keys line: ssh-ed25519, or ssh-rsa of at least 2048 bits.
  string public_key_openssh = 3;
}

message ImportKeyPairResponse {
  Operation operation = 1;
}

message DeleteKeyPairRequest {
  string request_id = 1;
  string key_name = 2;
}

message DeleteKeyPairResponse {
  Operation operation = 1;
}

message DescribeKeyPairsRequest {
  repeated string key_names = 1;
  int32 page_size = 2;
  string page_token = 3;
}

message DescribeKeyPairsResponse {
  repeated KeyPair key_pairs = 1;
  string next_page_token = 2;
}

message KeyPair {
  string key_pair_id = 1;
  string key_name = 2;
  KeyType key_type = 3;
  // "SHA256:..." as printed by ssh-keygen -l.
  string fingerprint = 4;
  google.protobuf.Timestamp create_time = 5;
}

enum KeyType {
  KEY_TYPE_UNSPECIFIED = 0;
  KEY_TYPE_ED25519 = 1;
  KEY_TYPE_RSA = 2;
}

// --------------------------------------------------------------- Operations

// Operation is the durable record of one accepted mutating request. It tracks
// one resource converging to the desired state that request recorded.
message Operation {
  string operation_id = 1;
  string request_id = 2;
  OperationKind kind = 3;
  oneof target {
    string instance_id = 4;
    string image_id = 5;
    string key_pair_id = 6;
  }
  OperationState state = 7;
  // Set iff state is OPERATION_STATE_FAILED.
  google.rpc.Status error = 8;
  google.protobuf.Timestamp create_time = 9;
  // Set iff state is terminal.
  google.protobuf.Timestamp end_time = 10;
}

enum OperationState {
  OPERATION_STATE_UNSPECIFIED = 0;
  OPERATION_STATE_PENDING = 1;
  OPERATION_STATE_SUCCEEDED = 2;
  OPERATION_STATE_FAILED = 3;
  // A later request changed the same resource before this one was observed.
  // The resource now reflects the later request.
  OPERATION_STATE_SUPERSEDED = 4;
}

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_RUN_INSTANCE = 1;
  OPERATION_KIND_START_INSTANCE = 2;
  OPERATION_KIND_STOP_INSTANCE = 3;
  OPERATION_KIND_REBOOT_INSTANCE = 4;
  OPERATION_KIND_TERMINATE_INSTANCE = 5;
  OPERATION_KIND_REGISTER_IMAGE = 6;
  OPERATION_KIND_CREATE_IMAGE = 7;
  OPERATION_KIND_DEREGISTER_IMAGE = 8;
  OPERATION_KIND_CREATE_KEY_PAIR = 9;
  OPERATION_KIND_IMPORT_KEY_PAIR = 10;
  OPERATION_KIND_DELETE_KEY_PAIR = 11;
}

message GetOperationRequest {
  string operation_id = 1;
}

message WaitOperationRequest {
  string operation_id = 1;
  // Defaults to 30s; capped at 60s.
  google.protobuf.Duration timeout = 2;
}
