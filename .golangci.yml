run:
  timeout: 5m

linters:
  disable-all: true
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gofmt
    - goimports

linters-settings:
  goimports:
    local-prefixes: github.com/popododo0720/vws-compute
  misspell:
    locale: US

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
