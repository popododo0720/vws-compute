# Common baseline: vws-deploy .github/golangci-common.yml (vws-deploy#300). Existing lll findings
# are fixed in a follow-up; until then new-from-merge-base holds changed lines to the baseline.
version: "2"
linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errcheck
    - errname
    - errorlint
    - govet
    - ineffassign
    - lll
    - misspell
    - nilerr
    - nilnil
    - noctx
    - sloglint
    - staticcheck
    - unused
    - wrapcheck
  settings:
    depguard:
      rules:
        no-sentry-direct:
          files: [$all]
          deny:
            - pkg: github.com/getsentry/sentry-go
              desc: use vws-lib/obs/report
    lll:
      line-length: 120
      tab-width: 1
    misspell:
      locale: US
    errcheck:
      check-type-assertions: true
      check-blank: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    wrapcheck:
      # Errors from this module already carry context; wrap at the edge
      # where a foreign error enters.
      ignore-package-globs:
        - github.com/popododo0720/vws-compute/internal/*
      # The defaults, plus gRPC status constructors (a wrapped status loses
      # its code on the wire) and Err() (context cancellation and
      # status.Err pass through as they are).
      ignore-sigs:
        - .Errorf(
        - errors.New(
        - errors.Unwrap(
        - errors.Join(
        - .Wrap(
        - .Wrapf(
        - .WithMessage(
        - .WithMessagef(
        - .WithStack(
        - status.Error(
        - .Err()
    sloglint:
      no-mixed-args: true
      attr-only: true
      context: all
      static-msg: true
      key-naming-case: snake
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
    paths:
      - third_party
      - third_party$
      - builtin$
      - examples$
    rules:
      # A test that ignores an error or asserts a type fails loudly on the
      # next line or panics; wrapping adds nothing to a test failure.
      - path: _test\.go
        linters:
          - errcheck
          - wrapcheck
issues:
  new-from-merge-base: origin/main
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/popododo0720/vws-compute
  exclusions:
    generated: lax
    paths:
      - third_party
      - third_party$
      - builtin$
      - examples$
