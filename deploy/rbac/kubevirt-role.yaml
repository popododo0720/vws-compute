# VM namespace (-vm-namespace). Used by internal/hypervisor/kubevirt agent.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vws-compute-vms
  namespace: vws-vms
rules:
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachines"]
    verbs:
      # get: ConvergeMachine reads the VM. image.go imageSource reads the
      # source machine of a capture.
      - get
      # list: image.go imageUsers finds VMs that clone from an image.
      - list
      # create: agent.go create.
      - create
      # patch: agent.go update, merge patch for power, size, and keys.
      - patch
      # delete: agent.go destroy.
      - delete
  - apiGroups: ["kubevirt.io"]
    resources: ["virtualmachineinstances"]
    # delete: agent.go update, reboot deletes the VMI so KubeVirt starts a new one.
    # get: agent.go running (a.c.Get of the VMI) checks phase Running and
    # condition Ready before a powered-on machine is reported ready. A denied
    # get keeps every powered-on instance reconciling.
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    # get: volumes.go checkAttachable (Get of the claim, about line 154) reads
    # the claim access modes, and for a hot-plugged volume its volumeMode,
    # before a volume is attached. A missing claim is
    # reported as transient, so a denied get would fail every attach.
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    # cloudinit.go: the cloud-init user data of a machine, Secret
    # <instance>-cloudinit, referenced by cloudInitNoCloud.userDataSecretRef.
    # create: ensureCloudInitSecret before the VM is created.
    # get: ensureCloudInitSecret on a retried create, deleteCloudInitSecret
    # to check the managed label.
    # update: ensureCloudInitSecret when a retried create renders other data.
    # delete: deleteCloudInitSecret in destroy, after the VM.
    verbs: ["get", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vws-compute-vms
  namespace: vws-vms
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vws-compute-vms
subjects:
  - kind: ServiceAccount
    name: vws-compute
    namespace: vws-compute
---
# Image namespace (-image-namespace). Used by internal/hypervisor/kubevirt image.go.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vws-compute-images
  namespace: vws-images
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes", "datasources"]
    verbs:
      # get: image.go ensure (compare) and imageSize (DataVolume phase).
      - get
      # create: image.go ensure.
      - create
      # delete: image.go removeImage.
      - delete
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    # get: image.go imageSize reads the bound claim capacity.
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vws-compute-images
  namespace: vws-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vws-compute-images
subjects:
  - kind: ServiceAccount
    name: vws-compute
    namespace: vws-compute
---
# Cross-namespace clone authorization for VMs created by agent.go create with
# a dataVolumeTemplates sourceRef to a DataSource in the image namespace.
# KubeVirt's VM webhook and virt-controller check that the VM's service account
# (the "default" account of the VM namespace unless a volume names another) may
# create datavolumes/source in the clone source namespace. The subject is
# therefore the VM namespace account, not vws-compute.
# Sources: CDI doc/RBAC.md "PVC Cloning"; KubeVirt PR #2509 and
# pkg/virt-controller/watch/vm authorizeDataVolume.
# Unverified on a cluster: whether CDI also requires a DataSource-specific
# permission when it resolves a sourceRef.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vws-compute-image-clone
  namespace: vws-images
rules:
  - apiGroups: ["cdi.kubevirt.io"]
    resources: ["datavolumes/source"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vws-compute-image-clone
  namespace: vws-images
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vws-compute-image-clone
subjects:
  - kind: ServiceAccount
    name: default
    namespace: vws-vms
