name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: Layer rules and Judgment count
        run: scripts/guard-agents.sh archtest
      - run: go vet ./...
      - run: go test -race ./...

  # Common golangci-lint baseline (vws-deploy .github/golangci-common.yml, vws-deploy#300).
  # fetch-depth 0 gives new-from-merge-base the origin/main history it compares against.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: guard-agents.sh rejects bad inputs
        run: scripts/guard-agents.sh selftest
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          install-only: true
      - name: Lint
        run: golangci-lint run --timeout=5m ./...
      - name: Format (gofumpt, goimports)
        run: golangci-lint fmt --diff

  imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: check-imports.sh rejects forbidden imports
        run: scripts/check-imports.sh selftest
      - name: no dependency on vws-proto or a service repo
        run: scripts/check-imports.sh

  consumer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
      - name: check-consumer.sh fails when the lib breaks
        run: scripts/check-consumer.sh selftest
      - name: sample consumer module builds against the lib
        run: scripts/check-consumer.sh

  # /correct loop guard (vws-deploy#448). Runs here, not in repo-guard.yml, which must stay
  # byte-identical to vws-deploy main (AGENTS.md rule L6).
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: AGENTS.md has the /correct loop, incident form and label
        run: scripts/guard.sh correct
      - name: guard.sh fails on an empty /correct loop section
        run: scripts/guard_test.sh

  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: vendor-lib.sh rejects edited, moved, and forged copies
        run: scripts/vendor-lib.sh selftest
