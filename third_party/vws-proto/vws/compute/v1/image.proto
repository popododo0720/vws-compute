syntax = "proto3";

package vws.compute.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/compute/v1;computev1";
option java_multiple_files = true;
option java_outer_classname = "ImageProto";
option java_package = "dev.vws.compute.v1";

// ImageService stores desired state for a machine image.
// Nodes reconcile spec. Mutations follow vws.common.v1.OperationMetadata.
// A ready image is a copy. Later writes to the source do not change it.
// A copy interrupted by a restart is retried until the image is complete.
// Delete is rejected with DEPENDENCY_MISSING while a Volume spec sources this image.
service ImageService {
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetImage(GetImageRequest) returns (Image) {
    option (google.api.http) = {get: "/v1/{name=projects/*/regions/*/images/*}"};
  }

  rpc ListImages(ListImagesRequest) returns (ListImagesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*/regions/*}/images"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateImage(CreateImageRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/regions/*}/images"
      body: "image"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Image"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateImage(UpdateImageRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{image.name=projects/*/regions/*/images/*}"
      body: "image"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Image"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteImage(DeleteImageRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/regions/*/images/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Image"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // ReportImageStatus is the node reconcile write.
  rpc ReportImageStatus(ReportImageStatusRequest) returns (ReportImageStatusResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/regions/*/images/*}:reportStatus"
      body: "*"
    };
  }
}

// Image is a regional copy of a volume or snapshot.
// Fields 1-10 are the shared resource envelope.
message Image {
  option (google.api.resource) = {
    type: "vws.compute/Image"
    pattern: "projects/{project}/regions/{region}/images/{image}"
    plural: "images"
    singular: "image"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  ImageSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  ImageStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// ImageSpec selects the copy source. Exactly one source is required.
// A missing source is INVALID_SPEC.
message ImageSpec {
  oneof source {
    string volume = 1 [
      (google.api.field_behavior) = IMMUTABLE,
      (google.api.resource_reference).type = "vws.storage/Volume"
    ];
    string snapshot = 2 [
      (google.api.field_behavior) = IMMUTABLE,
      (google.api.resource_reference).type = "vws.storage/Snapshot"
    ];
  }
  string description = 3;
  // Client-defined group name. Not a resource id.
  string family = 4;
}

message ImageStatus {
  vws.common.v1.ObservedState observed = 1;
  int64 size_gib = 2;
  // 0 to 100 while the copy is running.
  int32 progress_percent = 3;
}

message GetImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Image"
  ];
}

message ListImagesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.compute/Image"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListImagesResponse {
  repeated Image images = 1;
  string next_page_token = 2;
}

message CreateImageRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.compute/Image"
  ];
  // Final path segment. Must match vws.common.v1.ResourceId.
  string image_id = 2 [(google.api.field_behavior) = REQUIRED];
  Image image = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateImageRequest {
  Image image = 1 [(google.api.field_behavior) = REQUIRED];
  // Paths are relative to Image. status and output-only fields are rejected.
  // Omitted mask is treated as "spec,labels". source is immutable.
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  bool allow_missing = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteImageRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Image"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ReportImageStatusRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Image"
  ];
  ImageStatus status = 2 [(google.api.field_behavior) = REQUIRED];
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ReportImageStatusResponse {
  Image image = 1;
}
