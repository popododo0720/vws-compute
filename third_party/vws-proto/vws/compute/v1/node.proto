syntax = "proto3";

package vws.compute.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";
import "vws/compute/v1/instance.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/compute/v1;computev1";
option java_multiple_files = true;
option java_outer_classname = "NodeProto";
option java_package = "dev.vws.compute.v1";

// NodeService is the hypervisor agent's contract with compute.
// CreateNode registers the node. SyncNode is the heartbeat and the desired-state
// delivery. Instance status is ReportInstanceStatus. There is no Watch.
//
// NodeSpec is scheduler input. The agent does not apply it.
// CreateNode, UpdateNode, and a DeleteNode that passes its dependency check
// complete in the accept store. They do not stay RUNNING until a sync.
// SyncNode does not complete them.
//
// A node places instances in its own project and zone.
// Agents accept SyncNode responses of at least 16MiB.
// Agents call SyncNode more often than every 30 seconds while they want new
// assignments. The eligibility window is 30 seconds.
service NodeService {
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetNode(GetNodeRequest) returns (Node) {
    option (google.api.http) = {get: "/v1/{name=projects/*/zones/*/nodes/*}"};
  }

  rpc ListNodes(ListNodesRequest) returns (ListNodesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*/zones/*}/nodes"};
  }

  // Registration. Succeeds when the row is stored.
  // Idempotency follows OperationMetadata create rules, keyed by (parent, node_id).
  // The fingerprint is spec plus labels.
  // An agent that receives ALREADY_EXISTS Gets the node and continues with SyncNode.
  // It does not delete the node to recreate it.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateNode(CreateNodeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/zones/*}/nodes"
      body: "node"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Node"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // instance_slots may change. agent_version is not on the spec.
  // Omitted mask is treated as "spec,labels".
  // allow_missing creates through the CreateNode rules.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateNode(UpdateNodeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{node.name=projects/*/zones/*/nodes/*}"
      body: "node"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Node"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // DEPENDENCY_MISSING, and delete_time is not set, while any Instance
  // assigned_node names this node and that instance's delete_time is unset.
  // Assigned instances that already have delete_time stay with a live node:
  // if last_sync_time is set and within 30 seconds, DeleteNode is
  // DEPENDENCY_MISSING so ReportInstanceStatus can remove them.
  // Otherwise one store, serialized with placement for this zone, removes those
  // deleting instance rows, completes their delete operations, removes the node,
  // and succeeds this operation.
  // A request_id replay returns that operation after the row is gone.
  // Already gone with no remembered request_id follows OperationMetadata.
  // etag mismatch is ABORTED / ETAG_MISMATCH and writes nothing.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteNode(DeleteNodeRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/zones/*/nodes/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Node"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // SyncNode is the agent heartbeat and the desired-state read.
  // It does not return an Operation and it does not report instance status.
  // Missing node: NOT_FOUND / RESOURCE_NOT_FOUND. The agent treats that as
  // terminal and does not call CreateNode again.
  // observed.state must be READY, RECONCILING, or ERROR. Otherwise
  // INVALID_ARGUMENT / INVALID_SPEC and write nothing.
  // If the response cannot be encoded in 16MiB, the server returns
  // RESOURCE_EXHAUSTED and writes nothing.
  // Otherwise one store copies observed.state, conditions, and message onto
  // status.observed, sets status.observed.node to this node's resource name,
  // sets status.observed.generation to the stored node generation, and sets
  // status.last_sync_time to the server clock. The agent's observed.generation
  // and observed.node are ignored. A non-empty agent_version is copied to
  // status.agent_version. Empty keeps the stored value.
  // The server, not the agent, consumes NodeSpec, so this generation stamp does
  // not mean the agent applied a spec change.
  // The same store then runs placement for this zone.
  // A retry heartbeats again and returns the current assignment. Last write wins.
  // Crash before the store leaves the previous heartbeat.
  rpc SyncNode(SyncNodeRequest) returns (SyncNodeResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/zones/*/nodes/*}:sync"
      body: "*"
    };
  }
}

// Placement is serialized per zone, together with DeleteNode.
// It runs inside the SyncNode store and inside the CreateInstance store,
// including an UpdateInstance allow_missing create, when an eligible node exists.
// Only instances in that project and zone whose assigned_node is empty and
// whose delete_time is unset are considered.
// An eligible node has delete_time unset, status.observed.state READY or
// RECONCILING, last_sync_time set and no more than 30 seconds before the
// server clock, and fewer instances whose assigned_node equals this node than
// spec.instance_slots. Rows with delete_time set still count.
// The server chooses the eligible node with the largest free count
// (instance_slots minus that count). The tie break is the smallest node
// resource name.
// The write is compare-and-set while assigned_node is empty. A second placer
// that sees a value does not write. The fill does not increment
// Instance.generation and does not create an operation.
// No eligible node leaves assigned_node empty.
// A node whose observed.state is ERROR updates last_sync_time and is not eligible.
// It still receives its current assignments in the SyncNode response.

// Node is a zonal hypervisor.
// Fields 1-10 are the shared resource envelope.
message Node {
  option (google.api.resource) = {
    type: "vws.compute/Node"
    pattern: "projects/{project}/zones/{zone}/nodes/{node}"
    plural: "nodes"
    singular: "node"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  NodeSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  NodeStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message NodeSpec {
  // Maximum instances automatic placement may put here.
  // Inclusive range 0 to 200. Zero accepts no automatic assignment.
  // Above 200 or below 0 is INVALID_ARGUMENT / INVALID_SPEC and stores nothing.
  // Required on create. On update, unset keeps the stored value, including when
  // the mask is spec. A set value replaces it. Zero is a real value.
  optional int32 instance_slots = 1 [(google.api.field_behavior) = REQUIRED];
}

message NodeStatus {
  vws.common.v1.ObservedState observed = 1;
  // Server clock of the last committed SyncNode. Unset until then.
  google.protobuf.Timestamp last_sync_time = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Build identifier from the last SyncNode that set it. Empty until then.
  string agent_version = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetNodeRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Node"
  ];
}

message ListNodesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.compute/Node"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListNodesResponse {
  repeated Node nodes = 1;
  string next_page_token = 2;
}

message CreateNodeRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.compute/Node"
  ];
  // Final path segment. Must match vws.common.v1.ResourceId.
  string node_id = 2 [(google.api.field_behavior) = REQUIRED];
  Node node = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateNodeRequest {
  Node node = 1 [(google.api.field_behavior) = REQUIRED];
  // Paths are relative to Node. status and output-only fields are rejected.
  // Omitted mask is treated as "spec,labels".
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  bool allow_missing = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteNodeRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Node"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  // When set, must match the stored etag.
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

message SyncNodeRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Node"
  ];
  // Heartbeat. state must be READY, RECONCILING, or ERROR.
  // generation and node are ignored. The server writes both.
  vws.common.v1.ObservedState observed = 2 [(google.api.field_behavior) = REQUIRED];
  // Copied to NodeStatus.agent_version when non-empty. 1 to 63 bytes when set.
  // Longer than 63 bytes is INVALID_ARGUMENT / INVALID_SPEC and writes nothing.
  string agent_version = 3 [(google.api.field_behavior) = OPTIONAL];
}

message SyncNodeResponse {
  Node node = 1;
  // Instances whose assigned_node is this node, name ascending.
  // Includes rows with delete_time set. Not paginated.
  // Absent instances are not desired on this node.
  repeated Instance instances = 2;
}
