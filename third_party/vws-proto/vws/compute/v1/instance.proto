syntax = "proto3";

package vws.compute.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/compute/v1;computev1";
option java_multiple_files = true;
option java_outer_classname = "InstanceProto";
option java_package = "dev.vws.compute.v1";

// InstanceService stores the desired state of a virtual machine.
// Nodes reconcile spec. Mutations follow vws.common.v1.OperationMetadata.
// Delete does not delete volumes, key pairs, subnets, or security groups.
// Delete is rejected with DEPENDENCY_MISSING while an Address association names this instance.
service InstanceService {
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetInstance(GetInstanceRequest) returns (Instance) {
    option (google.api.http) = {get: "/v1/{name=projects/*/zones/*/instances/*}"};
  }

  rpc ListInstances(ListInstancesRequest) returns (ListInstancesResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*/zones/*}/instances"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateInstance(CreateInstanceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/zones/*}/instances"
      body: "instance"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Instance"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateInstance(UpdateInstanceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{instance.name=projects/*/zones/*/instances/*}"
      body: "instance"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Instance"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteInstance(DeleteInstanceRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/zones/*/instances/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.compute.v1.Instance"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // ReportInstanceStatus is the node reconcile write.
  // The server applies the idempotency rules on OperationMetadata.
  rpc ReportInstanceStatus(ReportInstanceStatusRequest) returns (ReportInstanceStatusResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/zones/*/instances/*}:reportStatus"
      body: "*"
    };
  }
}

// Instance is a zonal virtual machine.
// Fields 1-10 are the shared resource envelope.
message Instance {
  option (google.api.resource) = {
    type: "vws.compute/Instance"
    pattern: "projects/{project}/zones/{zone}/instances/{instance}"
    plural: "instances"
    singular: "instance"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  // Increments when spec changes. Starts at 1.
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  InstanceSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  InstanceStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

// InstanceSpec is the desired machine.
// The server rejects a spec that breaks any of these rules:
// - power is RUNNING or STOPPED
// - volumes has exactly one boot entry, and device names are unique
// - network interface device names are unique
// - each volume is in the instance zone, and no other instance references it
// - each subnet is in the instance zone
// - each security group belongs to that subnet's VPC
// - key_pair, when set, is in the region that contains the instance zone
message InstanceSpec {
  // Catalog name such as "n1.medium". Grammar: [a-z]([a-z0-9.-]{0,61}[a-z0-9])?
  string machine_type = 1 [(google.api.field_behavior) = REQUIRED];
  // RUNNING or STOPPED. The node starts or stops the machine to match.
  InstancePower power = 2 [(google.api.field_behavior) = REQUIRED];
  // Optional project-regional key pair. Empty means no key is installed.
  string key_pair = 3 [(google.api.resource_reference).type = "vws.compute/KeyPair"];
  // Opaque text passed to the guest on boot. Not interpreted by the control plane.
  // Maximum 32768 bytes.
  string user_data = 4;
  repeated NetworkInterface network_interfaces = 5;
  // Exactly one entry has boot = true. Device names are unique within the instance.
  repeated VolumeAttachment volumes = 6 [(google.api.field_behavior) = REQUIRED];
}

message NetworkInterface {
  // Unique within the instance. Address association targets this name.
  string device_name = 1 [(google.api.field_behavior) = REQUIRED];
  string subnet = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.network/Subnet"
  ];
  // Empty asks the node to allocate an address from the subnet.
  string private_ipv4 = 3;
  repeated string security_groups = 4 [(google.api.resource_reference).type = "vws.network/SecurityGroup"];
}

message VolumeAttachment {
  string volume = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Volume"
  ];
  string device_name = 2 [(google.api.field_behavior) = REQUIRED];
  bool boot = 3;
}

message InstanceStatus {
  vws.common.v1.ObservedState observed = 1;
  InstancePower power = 2;
  repeated ObservedNetworkInterface network_interfaces = 3;
}

message ObservedNetworkInterface {
  string device_name = 1;
  string subnet = 2;
  string private_ipv4 = 3;
  string public_ipv4 = 4;
}

enum InstancePower {
  INSTANCE_POWER_UNSPECIFIED = 0;
  INSTANCE_POWER_RUNNING = 1;
  INSTANCE_POWER_STOPPED = 2;
}

message GetInstanceRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Instance"
  ];
}

message ListInstancesRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.compute/Instance"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListInstancesResponse {
  repeated Instance instances = 1;
  string next_page_token = 2;
}

message CreateInstanceRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.compute/Instance"
  ];
  // Final path segment. Must match vws.common.v1.ResourceId.
  string instance_id = 2 [(google.api.field_behavior) = REQUIRED];
  Instance instance = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateInstanceRequest {
  Instance instance = 1 [(google.api.field_behavior) = REQUIRED];
  // Paths are relative to Instance. status and output-only fields are rejected.
  // Omitted mask is treated as "spec,labels".
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  // When true and the instance is missing, this RPC creates it.
  bool allow_missing = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteInstanceRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Instance"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  // When set, must match the stored etag.
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ReportInstanceStatusRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.compute/Instance"
  ];
  InstanceStatus status = 2 [(google.api.field_behavior) = REQUIRED];
  // Retries of the same report reuse this id. The reporting node is status.observed.node.
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ReportInstanceStatusResponse {
  Instance instance = 1;
}
