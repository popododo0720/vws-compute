syntax = "proto3";

package vws.storage.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/storage/v1;storagev1";
option java_multiple_files = true;
option java_outer_classname = "BucketProto";
option java_package = "dev.vws.storage.v1";

// BucketService stores desired state for an object bucket.
// Nodes reconcile spec. Mutations follow vws.common.v1.OperationMetadata.
service BucketService {
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetBucket(GetBucketRequest) returns (Bucket) {
    option (google.api.http) = {get: "/v1/{name=projects/*/buckets/*}"};
  }

  rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*}/buckets"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateBucket(CreateBucketRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*}/buckets"
      body: "bucket"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.storage.v1.Bucket"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateBucket(UpdateBucketRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{bucket.name=projects/*/buckets/*}"
      body: "bucket"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.storage.v1.Bucket"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteBucket(DeleteBucketRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/buckets/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.storage.v1.Bucket"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // ReportBucketStatus is the node reconcile write.
  rpc ReportBucketStatus(ReportBucketStatusRequest) returns (ReportBucketStatusResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/buckets/*}:reportStatus"
      body: "*"
    };
  }
}

// Bucket is a project-scoped container for objects.
// Fields 1-10 are the shared resource envelope.
// Delete is rejected with DEPENDENCY_MISSING while the bucket still has objects.
message Bucket {
  option (google.api.resource) = {
    type: "vws.storage/Bucket"
    pattern: "projects/{project}/buckets/{bucket}"
    plural: "buckets"
    singular: "bucket"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  BucketSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  BucketStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message BucketSpec {
  // Region id. Uses vws.common.v1.ResourceId grammar. Immutable.
  string region = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // When true, object updates add a version and object deletes write a delete marker.
  // Existing versions are not separate resources. Get returns NOT_FOUND after a delete marker.
  bool versioning = 2;
}

message BucketStatus {
  vws.common.v1.ObservedState observed = 1;
}

message GetBucketRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Bucket"
  ];
}

message ListBucketsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.storage/Bucket"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListBucketsResponse {
  repeated Bucket buckets = 1;
  string next_page_token = 2;
}

message CreateBucketRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.storage/Bucket"
  ];
  // Final path segment. Must match vws.common.v1.ResourceId.
  string bucket_id = 2 [(google.api.field_behavior) = REQUIRED];
  Bucket bucket = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateBucketRequest {
  Bucket bucket = 1 [(google.api.field_behavior) = REQUIRED];
  // Paths are relative to Bucket. region is immutable.
  // Omitted mask is treated as "spec,labels".
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  bool allow_missing = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteBucketRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Bucket"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ReportBucketStatusRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Bucket"
  ];
  BucketStatus status = 2 [(google.api.field_behavior) = REQUIRED];
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ReportBucketStatusResponse {
  Bucket bucket = 1;
}
