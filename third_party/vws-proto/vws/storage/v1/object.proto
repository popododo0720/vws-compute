syntax = "proto3";

package vws.storage.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/storage/v1;storagev1";
option java_multiple_files = true;
option java_outer_classname = "ObjectProto";
option java_package = "dev.vws.storage.v1";

// ObjectService stores desired state for one object.
// Nodes reconcile spec. Mutations follow vws.common.v1.OperationMetadata
// except where a method comment below overrides it.
// The payload is stored by this API before the operation name is returned.
// Decoded payload limit is 4194304 bytes on CreateObject, UpdateObject, and WriteObject.
// GetObject and ListObjects do not return the payload. ReadObject does.
// Object.etag is the concurrency token. status.md5 and spec.sha256 are digests.
// Servers accept CreateObject, UpdateObject, and WriteObject requests of at least 8MiB.
// Clients of ReadObject accept responses of at least 8MiB.
// The limit is on decoded bytes. JSON base64 is larger and is not the limit.
service ObjectService {
  // AIP-131: the Get response is the resource. The payload is not included.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetObject(GetObjectRequest) returns (Object) {
    option (google.api.http) = {get: "/v1/{name=projects/*/buckets/*/objects/*}"};
  }

  rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*/buckets/*}/objects"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateObject(CreateObjectRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/buckets/*}/objects"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.storage.v1.Object"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateObject(UpdateObjectRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{object.name=projects/*/buckets/*/objects/*}"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.storage.v1.Object"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteObject(DeleteObjectRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/buckets/*/objects/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.storage.v1.Object"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // ReadObject returns the stored payload.
  // No side effects. A read concurrent with a payload store returns either the
  // previous record or the committed record, with contents and object from that
  // same record. delete_time set, or a delete marker, is NOT_FOUND / RESOURCE_NOT_FOUND.
  rpc ReadObject(ReadObjectRequest) returns (ReadObjectResponse) {
    option (google.api.http) = {get: "/v1/{name=projects/*/buckets/*/objects/*}:read"};
  }

  // WriteObject replaces the stored payload, including with a zero-length payload.
  // It does not create. verb is UPDATE.
  //
  // Idempotency key is (name, request_id). The fingerprint is name, contents,
  // sha256, etag, and validate_only. Replay is checked before existence,
  // delete_time, and the etag compare, so a lost response retries onto the
  // operation that committed.
  // Same request_id and same fingerprint: return that operation.
  // Same request_id and a different fingerprint: ABORTED / IDEMPOTENCY_CONFLICT
  // and write nothing. request_id is remembered for 24 hours and recorded only
  // when a store commits.
  //
  // Then: missing object is NOT_FOUND / RESOURCE_NOT_FOUND.
  // delete_time set is FAILED_PRECONDITION / DEPENDENCY_NOT_READY.
  // etag set and different is ABORTED / ETAG_MISMATCH.
  // sha256 set and different from contents is INVALID_ARGUMENT / INVALID_SPEC.
  // Identical stored bytes: succeeded operation. generation, etag, sha256, md5,
  // size_bytes, and version stay as stored.
  // Otherwise one store writes the bytes, sets spec.sha256, status.md5, and
  // status.size_bytes, changes etag, increments generation, and stores a RUNNING
  // operation. When bucket versioning is on, that store also sets status.version
  // to a new non-empty value. Then the server returns the operation name.
  // validate_only checks the request and writes nothing. The succeeded operation
  // has an unset response.
  // Crash before the store leaves the previous bytes and no new operation.
  // Crash after it is recovered by reading the operation.
  //
  // AIP-151: the mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc WriteObject(WriteObjectRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/buckets/*/objects/*}:write"
      body: "*"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.storage.v1.Object"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // ReportObjectStatus is the node reconcile write.
  // The server ignores status.md5 and status.size_bytes and rewrites both from
  // the stored payload. status.version is left as stored when the server assigned
  // it. status.observed is the node's to write.
  // A generation conflict stores nothing.
  rpc ReportObjectStatus(ReportObjectStatusRequest) returns (ReportObjectStatusResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/buckets/*/objects/*}:reportStatus"
      body: "*"
    };
  }
}

// Object is one key in a bucket.
// Fields 1-10 are the shared resource envelope.
//
// The {object} path segment is the key percent-encoded per RFC 3986.
// Encode every byte that is not an unreserved character. Encode "/" as "%2F".
// The decoded key is 1 to 1024 bytes, is not "." or "..", does not start or end
// with "/", does not contain "//", and contains no ASCII control characters.
// This is the only resource id that is not vws.common.v1.ResourceId.
message Object {
  option (google.api.resource) = {
    type: "vws.storage/Object"
    pattern: "projects/{project}/buckets/{bucket}/objects/{object}"
    plural: "objects"
    singular: "object"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Concurrency token. Not an MD5 and not spec.sha256.
  // Changes when a stored spec, label, or payload change is committed.
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  ObjectSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  ObjectStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ObjectSpec {
  string content_type = 1;
  string cache_control = 2;
  map<string, string> metadata = 3;
  // Lowercase hex SHA-256 of the stored payload. 64 hex characters.
  // Empty on create, or on a payload replace, means the server fills it from
  // the bytes being stored. A non-empty value must match those bytes or the
  // RPC returns INVALID_ARGUMENT / INVALID_SPEC and stores nothing.
  // On an update that does not replace the payload, empty means keep the stored
  // hash. A non-empty value must match the stored payload.
  // A create or update retry whose sha256 is empty matches a stored hash of the
  // same bytes. That fill is not a desired-state mismatch.
  // This field is not Object.etag and not ObjectStatus.md5.
  string sha256 = 4;
}

message ObjectStatus {
  vws.common.v1.ObservedState observed = 1;
  // Byte length of the stored payload. The server writes it in the same store
  // as the payload. OUTPUT_ONLY. ReportObjectStatus rewrites it from the payload.
  int64 size_bytes = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set by the server when bucket versioning is on and the payload changes.
  // Empty when versioning is off. ReportObjectStatus does not overwrite it.
  string version = 3;
  // Lowercase hex MD5 of the stored payload. 32 hex characters, no quotes.
  // The server writes it in the same store as the payload, before the operation
  // name is returned. GetObject returns it before any node report.
  // When empty and a payload is stored, Get and List fill it from that payload.
  // OUTPUT_ONLY. Not a concurrency token. Object.etag is the concurrency token.
  string md5 = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetObjectRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Object"
  ];
}

message ListObjectsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.storage/Object"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListObjectsResponse {
  repeated Object objects = 1;
  string next_page_token = 2;
}

message CreateObjectRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.storage/Object"
  ];
  // Percent-encoded object key. See Object.
  string object_id = 2 [(google.api.field_behavior) = REQUIRED];
  Object object = 3 [(google.api.field_behavior) = REQUIRED];
  // Payload. Zero length is a valid empty object. Maximum 4194304 bytes.
  // The server stores these bytes, spec.sha256, status.md5, and status.size_bytes
  // before it returns the operation name. When bucket versioning is on, it also
  // sets status.version in that store.
  // Idempotency follows OperationMetadata create rules. The request fingerprint
  // includes contents, labels, and spec other than a server-filled sha256.
  // An empty request sha256 matches the stored hash of those same contents.
  bytes contents = 4 [(google.api.field_behavior) = REQUIRED];
  string request_id = 5 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 6 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateObjectRequest {
  Object object = 1 [(google.api.field_behavior) = REQUIRED];
  // Legacy payload replace. Independent of update_mask.
  // Length 0, including an omitted proto3 bytes field, leaves the payload unchanged.
  // Length greater than 0 replaces the payload in the same store as WriteObject,
  // together with the spec and label update. One generation increment if either
  // the effective spec, the labels, or the bytes change.
  // The update no-op includes the payload: identical spec, labels, and bytes
  // succeed without a new generation. A non-empty contents that differs is a change
  // even when spec and labels match.
  // Zero-length replacement is WriteObject only.
  // Maximum 4194304 bytes when non-empty.
  // allow_missing creates through the CreateObject rules, including hashes for
  // a zero-length payload.
  bytes contents = 2;
  // Paths are relative to Object. status and output-only fields are rejected.
  // Omitted mask is treated as "spec,labels".
  google.protobuf.FieldMask update_mask = 3;
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
  bool allow_missing = 6 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteObjectRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Object"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ReportObjectStatusRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Object"
  ];
  ObjectStatus status = 2 [(google.api.field_behavior) = REQUIRED];
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ReportObjectStatusResponse {
  Object object = 1;
}

message ReadObjectRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Object"
  ];
  // When set, must equal Object.etag of the record that would be returned.
  // Otherwise ABORTED / ETAG_MISMATCH and no response body.
  string etag = 2 [(google.api.field_behavior) = OPTIONAL];
}

message ReadObjectResponse {
  // Entire stored payload. No range. Empty when the stored object is empty.
  // Maximum 4194304 bytes.
  bytes contents = 1 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Metadata of the same record as contents, including etag, spec.sha256, and status.md5.
  Object object = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message WriteObjectRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.storage/Object"
  ];
  // Full replacement payload. Maximum 4194304 bytes.
  // Unset is INVALID_ARGUMENT / INVALID_SPEC and stores nothing.
  // Set and empty stores an empty object.
  // Callers that want to keep the stored bytes do not call WriteObject.
  optional bytes contents = 2 [(google.api.field_behavior) = REQUIRED];
  // Lowercase hex SHA-256 of contents. Empty means the server computes it.
  // When set, it must match contents or the RPC returns INVALID_ARGUMENT / INVALID_SPEC.
  string sha256 = 3 [(google.api.field_behavior) = OPTIONAL];
  // When set, must equal the stored Object.etag. Checked after request_id replay
  // and before the byte compare.
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
  string request_id = 5 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 6 [(google.api.field_behavior) = OPTIONAL];
}
