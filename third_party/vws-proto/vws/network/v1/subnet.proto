syntax = "proto3";

package vws.network.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/api/field_info.proto";
import "google/api/resource.proto";
import "google/longrunning/operations.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "vws/common/v1/resource.proto";

option go_package = "github.com/popododo0720/vws-proto/gen/go/vws/network/v1;networkv1";
option java_multiple_files = true;
option java_outer_classname = "SubnetProto";
option java_package = "dev.vws.network.v1";

// SubnetService stores desired state for a zonal subnet of a VPC.
// Nodes reconcile spec. Mutations follow vws.common.v1.OperationMetadata.
// ipv4_cidr must be inside the parent VPC CIDR and must use a longer prefix.
// Delete is rejected with DEPENDENCY_MISSING while an instance still references the subnet.
service SubnetService {
  // AIP-131: the Get response is the resource.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  rpc GetSubnet(GetSubnetRequest) returns (Subnet) {
    option (google.api.http) = {get: "/v1/{name=projects/*/regions/*/vpcs/*/subnets/*}"};
  }

  rpc ListSubnets(ListSubnetsRequest) returns (ListSubnetsResponse) {
    option (google.api.http) = {get: "/v1/{parent=projects/*/regions/*/vpcs/*}/subnets"};
  }

  // AIP-151: every mutation returns google.longrunning.Operation.
  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc CreateSubnet(CreateSubnetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      post: "/v1/{parent=projects/*/regions/*/vpcs/*}/subnets"
      body: "subnet"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.network.v1.Subnet"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc UpdateSubnet(UpdateSubnetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {
      patch: "/v1/{subnet.name=projects/*/regions/*/vpcs/*/subnets/*}"
      body: "subnet"
    };
    option (google.longrunning.operation_info) = {
      response_type: "vws.network.v1.Subnet"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // buf:lint:ignore RPC_RESPONSE_STANDARD_NAME
  // buf:lint:ignore RPC_REQUEST_RESPONSE_UNIQUE
  rpc DeleteSubnet(DeleteSubnetRequest) returns (google.longrunning.Operation) {
    option (google.api.http) = {delete: "/v1/{name=projects/*/regions/*/vpcs/*/subnets/*}"};
    option (google.longrunning.operation_info) = {
      response_type: "vws.network.v1.Subnet"
      metadata_type: "vws.common.v1.OperationMetadata"
    };
  }

  // ReportSubnetStatus is the node reconcile write.
  rpc ReportSubnetStatus(ReportSubnetStatusRequest) returns (ReportSubnetStatusResponse) {
    option (google.api.http) = {
      post: "/v1/{name=projects/*/regions/*/vpcs/*/subnets/*}:reportStatus"
      body: "*"
    };
  }
}

// Subnet is a zonal slice of a VPC.
// Fields 1-10 are the shared resource envelope.
message Subnet {
  option (google.api.resource) = {
    type: "vws.network/Subnet"
    pattern: "projects/{project}/regions/{region}/vpcs/{vpc}/subnets/{subnet}"
    plural: "subnets"
    singular: "subnet"
  };

  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  string uid = 2 [
    (google.api.field_behavior) = OUTPUT_ONLY,
    (google.api.field_info).format = UUID4
  ];
  int64 generation = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  string etag = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  map<string, string> labels = 5;
  SubnetSpec spec = 6 [(google.api.field_behavior) = REQUIRED];
  SubnetStatus status = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp create_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp delete_time = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message SubnetSpec {
  // Zone id. Uses vws.common.v1.ResourceId grammar. The zone belongs to the parent region. Immutable.
  string zone = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  // IPv4 CIDR inside the parent VPC, with a longer prefix. Immutable.
  string ipv4_cidr = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = IMMUTABLE
  ];
  string description = 3;
}

message SubnetStatus {
  vws.common.v1.ObservedState observed = 1;
}

message GetSubnetRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.network/Subnet"
  ];
}

message ListSubnetsRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.network/Subnet"
  ];
  // Server default is 50. Values above 1000 are coerced to 1000.
  int32 page_size = 2;
  string page_token = 3;
}

message ListSubnetsResponse {
  repeated Subnet subnets = 1;
  string next_page_token = 2;
}

message CreateSubnetRequest {
  string parent = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).child_type = "vws.network/Subnet"
  ];
  // Final path segment. Must match vws.common.v1.ResourceId.
  string subnet_id = 2 [(google.api.field_behavior) = REQUIRED];
  Subnet subnet = 3 [(google.api.field_behavior) = REQUIRED];
  string request_id = 4 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 5 [(google.api.field_behavior) = OPTIONAL];
}

message UpdateSubnetRequest {
  Subnet subnet = 1 [(google.api.field_behavior) = REQUIRED];
  // Paths are relative to Subnet. zone and ipv4_cidr are immutable.
  // Omitted mask is treated as "spec,labels".
  google.protobuf.FieldMask update_mask = 2;
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool validate_only = 4 [(google.api.field_behavior) = OPTIONAL];
  bool allow_missing = 5 [(google.api.field_behavior) = OPTIONAL];
}

message DeleteSubnetRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.network/Subnet"
  ];
  string request_id = 2 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
  bool allow_missing = 3 [(google.api.field_behavior) = OPTIONAL];
  string etag = 4 [(google.api.field_behavior) = OPTIONAL];
}

message ReportSubnetStatusRequest {
  string name = 1 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.resource_reference).type = "vws.network/Subnet"
  ];
  SubnetStatus status = 2 [(google.api.field_behavior) = REQUIRED];
  string request_id = 3 [
    (google.api.field_info).format = UUID4,
    (google.api.field_behavior) = OPTIONAL
  ];
}

message ReportSubnetStatusResponse {
  Subnet subnet = 1;
}
